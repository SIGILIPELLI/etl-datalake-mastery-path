site_name: ETL & Data Lake Mastery Path
site_description: A structured, module-wise training program on ETL/ELT pipeline design and Data Lake architecture — from your first extract-transform-load script to governed, multi-zone lakehouse platforms, with runnable Python code in every module.
site_url: https://sigilipelli.github.io/etl-datalake-mastery-path/
repo_url: https://github.com/SIGILIPELLI/etl-datalake-mastery-path
repo_name: etl-datalake-mastery-path

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

# --- auto-pruned stub levels (see AdSense low-value-content fix) ---
exclude_docs: |
  level-2/[0-9]*
  level-3/[0-9]*
  level-4/[0-9]*
# --- end auto-pruned stub levels ---

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · What Is ETL vs. ELT?": level-1/01-etl-vs-elt.md
      - "02 · Data Sources & Ingestion Patterns": level-1/02-data-sources-ingestion-patterns.md
      - "03 · Extraction Basics (Files, APIs, Databases)": level-1/03-extraction-basics.md
      - "04 · Transformation Basics (Clean, Cast, Dedupe)": level-1/04-transformation-basics.md
      - "05 · Loading Into a Target": level-1/05-loading-into-a-target.md
      - "06 · What Is a Data Lake? (vs. Data Warehouse)": level-1/06-what-is-a-data-lake.md
      - "07 · Bronze/Silver/Gold Layering": level-1/07-bronze-silver-gold-layering.md
      - "08 · File Formats: CSV, JSON, Parquet, Avro": level-1/08-file-formats.md
      - "09 · Why You Need a Scheduler": level-1/09-orchestration-basics.md
      - "10 · Capstone — End-to-End ETL to a Bronze/Silver/Gold Lake": level-1/10-capstone-etl-lake-pipeline.md
  - "Level 2 · Intermediate":
